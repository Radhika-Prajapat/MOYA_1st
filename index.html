<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Secret For Horrible ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.css">
</head>

<body class="password-body">

    <audio id="bgMusic" loop>
    <source src="bday_song.mpeg" type="audio/mpeg">
</audio>

    <div class="stars"></div>

     <!-- FLOATING CARTOONS -->
        <div class="floating-cartoons" id="floatingCartoons"></div>
        <div class="bubble-container" id="bubbleContainer"></div>
        
 <div class="birthday-stickers" id="heart-container" >
    
    <span class="sticker sticker1">🎂</span>
    <span class="sticker sticker2">🎈</span>
    <span class="sticker sticker3">🎁</span>
    <span class="sticker sticker4">❤️</span>
    <span class="sticker sticker5">✨</span>
    <span class="sticker sticker6">🎉</span>
    <span class="sticker sticker7">💝</span>
    <span class="sticker sticker8">🎈</span>
    <span class="sticker sticker9">🎂</span>
    <span class="sticker sticker10">🎈</span>
    <span class="sticker sticker11">🎁</span>
    <span class="sticker sticker12">❤️</span>
    <span class="sticker sticker13">✨</span>
    <span class="sticker sticker14">🎉</span>
    <span class="sticker sticker15">💝</span>
    <span class="sticker sticker16">🎈</span>
    <span class="sticker sticker17">🧁</span>
    <span class="stickersticker18">🎊</span>
    <span class="sticker sticker19">💖</span>
    <span class="sticker sticker20">🌟</span>
    <span class="sticker sticker21">🎀</span>
    <span class="sticker sticker22">🍰</span>
    <span class="sticker sticker23">🥳</span>
    <span class="sticker sticker24">💕</span>
    <span class="sticker sticker25">🎈</span>
    <span class="sticker sticker26">🎁</span>
    <span class="sticker sticker27"></span>
    <span class="sticker sticker28">💗</span>
</div>

    <div class="password-box">
       

        <div class="big-icon">🔐</div>

        <h1>Hey....❤️</h1>

        <p>Someone has prepared something special for you...</p>

        <p class="hint">
            But first, prove that you're the right person 👀
        </p>

        <input
            type="password"
            id="password"
            placeholder="Enter secret password"
        >

        <button onclick="checkPassword()">
            Unlock My Surprise 💌
        </button>

        <p id="error"></p>

        <!-- COUNTDOWN -->

        <div class="countdown">

            <div>
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div>
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div>
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div>
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>

        </div>
        


        <div class="signature">
             MOYA✨
        </div>

    </div>

    <script src="script.js"></script>
     <script src="password.js"></script>
    <script src="index.js"></script>

</body>
</html>
